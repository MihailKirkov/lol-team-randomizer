name: Run Tests

on:
  push:
    branches: [ main, dev, limit-tesst ]
  pull_request:
    branches: [ main, dev, limit-tesst ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run Jest tests
        run: npm test
